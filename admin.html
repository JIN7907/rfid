<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 학급 관리 시스템 - 진짜 실시간 관제</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app" class="p-6 max-w-5xl mx-auto">
        <!-- 상단 헤더 -->
        <header class="bg-white p-6 rounded-xl shadow-md mb-6 flex justify-between items-center border-l-4 border-indigo-600">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">🏫 스마트 학급 실시간 관제 센터</h1>
                <p class="text-sm text-gray-500 mt-1">서버 연결 상태: <span id="server-status" class="font-bold text-yellow-600">연결 확인 중...</span></p>
            </div>
            <div id="user-info" class="hidden text-right">
                <span id="user-display" class="font-bold text-indigo-600 text-lg"></span>
                <button onclick="logout()" class="ml-4 text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded-lg transition">로그아웃</button>
            </div>
        </header>

        <!-- 로그인 폼 -->
        <div id="login-section" class="bg-white p-8 rounded-xl shadow-md max-w-md mx-auto">
            <h2 class="text-xl font-bold mb-4 text-center text-gray-700">관리자/교사 로그인</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">아이디</label>
                    <input type="text" id="login-id" value="admin" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">비밀번호</label>
                    <input type="password" id="login-pw" value="1234" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition">서버 접속하기</button>
            </form>
            <p id="login-error" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </div>

        <!-- 대시보드 화면 (로그인 후 표시) -->
        <div id="dashboard-section" class="hidden space-y-6">
            <!-- 안내 노티 -->
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg text-blue-700 text-sm">
                💡 <strong>실시간 연동 중:</strong> 아래 표는 3초마다 Render 백엔드 서버(`GET /api/students`)에서 직접 데이터를 가져와 갱신됩니다.
            </div>

            <!-- 학생 데이터 리스트 -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden">
                <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                    <h2 class="text-lg font-bold text-gray-700">학생 통신 상태 및 벌점 관리</h2>
                    <button onclick="fetchStudents()" class="text-sm bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg font-semibold hover:bg-indigo-200">🔄 지금 새로고침</button>
                </div>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm">
                            <th class="p-4">ID</th>
                            <th class="p-4">이름</th>
                            <th class="p-4">통신 상태 (Heartbeat)</th>
                            <th class="p-4">현재 벌점</th>
                            <th class="p-4 text-center">제어 / 관리</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body">
                        <!-- 서버에서 불러온 진짜 데이터가 여기 들어감 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let fetchInterval = null;

        // 페이지 로드 시 서버가 켜져있는지 바로 확인
        async function checkServer() {
            try {
                const res = await fetch('/');
                const data = await res.json();
                document.getElementById('server-status').innerText = '🟢 온라인 (정상 작동 중)';
                document.getElementById('server-status').className = 'font-bold text-green-600';
            } catch (err) {
                document.getElementById('server-status').innerText = '🔴 서버 응답 없음';
                document.getElementById('server-status').className = 'font-bold text-red-600';
            }
        }
        checkServer();

        // 진짜 로그인 요청 (POST /api/login)
        async function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value;
            const pw = document.getElementById('login-pw').value;
            const errEl = document.getElementById('login-error');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, pw })
                });
                const data = await res.json();

                if (data.success) {
                    currentUser = data.user;
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                    document.getElementById('user-info').classList.remove('hidden');
                    document.getElementById('user-display').innerText = `${data.user.name} 님`;
                    
                    // 로그인 성공 시 서버에서 실시간 학생 데이터 주기적으로 가져오기 시작
                    fetchStudents();
                    fetchInterval = setInterval(fetchStudents, 3000);
                } else {
                    errEl.innerText = data.message;
                    errEl.classList.remove('hidden');
                }
            } catch (err) {
                errEl.innerText = '서버와 통신할 수 없습니다.';
                errEl.classList.remove('hidden');
            }
        }

        // 진짜 학생 데이터 가져오기 (GET /api/students)
        async function fetchStudents() {
            try {
                const res = await fetch('/api/students');
                const students = await res.json();
                const tbody = document.getElementById('student-table-body');
                tbody.innerHTML = '';

                if (students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-gray-400">등록되거나 신호를 보낸 학생이 없습니다.</td></tr>';
                    return;
                }

                students.forEach(s => {
                    const isOnline = s.status === 'online';
                    const tr = document.createElement('tr');
                    tr.className = 'border-b hover:bg-gray-50';
                    tr.innerHTML = `
                        <td class="p-4 font-mono text-sm">${s.id}</td>
                        <td class="p-4 font-bold text-gray-800">${s.name}</td>
                        <td class="p-4">
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${isOnline ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                ${isOnline ? '🟢 연결됨' : '🚨 끊김 (앱 삭제)'}
                            </span>
                        </td>
                        <td class="p-4 font-bold ${s.penalty > 0 ? 'text-red-600' : 'text-gray-600'}">${s.penalty || 0} 점</td>
                        <td class="p-4 text-center space-x-2">
                            <button onclick="givePenalty('${s.id}')" class="bg-amber-500 text-white text-xs px-2.5 py-1.5 rounded hover:bg-amber-600">벌점 부여</button>
                            <button onclick="deleteStudent('${s.id}')" class="bg-red-500 text-white text-xs px-2.5 py-1.5 rounded hover:bg-red-600">삭제</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('학생 데이터 수신 실패:', err);
            }
        }

        // 진짜 벌점 부여 (POST /api/penalty)
        async function givePenalty(studentId) {
            const points = prompt('부여할 벌점을 입력하세요:', '1');
            if (!points || isNaN(points)) return;

            const res = await fetch('/api/penalty', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ studentId, points: Number(points), reason: '관제센터 직접 부여' })
            });
            const data = await res.json();
            alert(data.message);
            fetchStudents(); // 부여 후 데이터 즉시 새로고침
        }

        // 진짜 학생 삭제 (DELETE /api/student/:id)
        async function deleteStudent(studentId) {
            if (!confirm('정말 이 학생 데이터를 서버에서 삭제하시겠습니까?')) return;

            const res = await fetch(`/api/student/${studentId}`, { method: 'DELETE' });
            const data = await res.json();
            alert(data.message);
            fetchStudents(); // 삭제 후 데이터 즉시 새로고침
        }

        function logout() {
            clearInterval(fetchInterval);
            location.reload();
        }
    </script>
</body>
</html>
