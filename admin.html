<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETI 스마트 통합 관제센터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        .seat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.75rem; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- 로그인 화면 -->
    <div id="login-container" class="flex h-screen items-center justify-center">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-xl max-w-sm w-full border border-slate-700">
            <h2 class="text-2xl font-black mb-2 text-center text-white"><i class="fa-solid fa-tower-observation text-indigo-500"></i> 통합 관제센터</h2>
            <p class="text-center text-xs text-slate-400 mb-6">스마트 기기 통합 제어 시스템</p>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="text" id="input-id" value="master" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-3 px-4 text-sm text-white focus:border-indigo-500 outline-none" placeholder="ID (master)" required>
                <input type="password" id="input-pw" value="1234" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-3 px-4 text-sm text-white focus:border-indigo-500 outline-none" placeholder="비밀번호" required>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg mt-2">접속</button>
            </form>
        </div>
    </div>

    <!-- 대시보드 화면 -->
    <div id="dashboard-container" class="hidden p-6 max-w-7xl mx-auto space-y-6">
        
        <!-- 상단 헤더 -->
        <header class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black flex items-center gap-2">
                    <i class="fa-solid fa-tower-observation text-indigo-400"></i> ETI 통합 관제 현황판
                </h1>
                <p id="user-role-badge" class="text-sm text-indigo-300 mt-1 font-bold">사용자 접속 중</p>
            </div>
            <div class="flex items-center gap-4">
                <!-- 긴급 해제 버튼 (마스터 전용) -->
                <button id="btn-emergency" onclick="triggerEmergency()" class="hidden px-5 py-2.5 rounded-lg text-sm font-black bg-rose-600 text-white hover:bg-rose-500 shadow-[0_0_15px_rgba(225,29,72,0.5)] transition">
                    <i class="fa-solid fa-unlock-keyhole"></i> 전교생 기기 긴급 해제
                </button>
                <button onclick="switchToTotalView()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold transition">
                    <i class="fa-solid fa-border-all"></i> 전체 상황판
                </button>
            </div>
        </header>

        <!-- 1️⃣ [ALL - 전체 상황판 뷰] (학교장 한눈에 보기) -->
        <div id="total-view-panel" class="space-y-4">
            <h2 class="text-lg font-bold text-slate-300 border-b border-slate-700 pb-2">전체 학급 관제 현황 (클릭 시 상세 이동)</h2>
            <!-- 학급별 블록 그리드 -->
            <div id="class-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- JS 동적 렌더링 -->
            </div>
        </div>

        <!-- 2️⃣ [개별 학급 상세 뷰] -->
        <div id="class-view-panel" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- ⬅️ 교실 좌석 배치도 -->
            <div class="lg:col-span-2 bg-slate-800 border border-slate-700 rounded-2xl p-6 flex flex-col">
                <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                    <h2 class="font-black text-xl text-white" id="room-title">1학년 1반 관제</h2>
                    <div class="flex gap-2">
                        <button onclick="toggleSetupClass()" class="text-xs bg-slate-700 px-3 py-1.5 rounded text-white hover:bg-slate-600">수업 상태 변경(테스트)</button>
                        <button onclick="simulateStudentTag()" class="text-xs bg-indigo-600 px-3 py-1.5 rounded text-white hover:bg-indigo-500">학생 태그(테스트)</button>
                    </div>
                </div>
                
                <div class="w-full flex justify-center mb-8">
                    <div class="bg-slate-900 text-slate-400 px-16 py-3 rounded-lg font-black text-sm border-b-4 border-slate-700">교 탁</div>
                </div>
                <!-- 좌석도 -->
                <div id="seating-chart" class="seat-grid w-full max-w-3xl mx-auto flex-1 pb-4"></div>
            </div>

            <!-- ➡️ 우측 명렬표 -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl flex flex-col overflow-hidden h-[750px]">
                <div class="p-4 border-b border-slate-700 bg-slate-900 flex justify-between items-center">
                    <h3 class="font-bold text-white">학급 명렬 리스트</h3>
                    <span id="class-stats" class="text-xs font-bold text-indigo-300">총 0명</span>
                </div>
                <div class="flex-1 overflow-y-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-900 text-slate-400 sticky top-0 border-b border-slate-700">
                            <tr>
                                <th class="p-3 text-center">번호</th>
                                <th class="p-3">이름</th>
                                <th class="p-3 text-center">기기 상태</th>
                                <th class="p-3 text-center">사유 입력</th>
                            </tr>
                        </thead>
                        <tbody id="student-list-body" class="divide-y divide-slate-700/50 text-slate-200"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let studentsData = [];
        let classesData = [];
        let currentUser = null;
        let viewMode = 'TOTAL'; 
        let viewGrade = 1, viewClass = 1;
        const totalSeats = 25;

        // 로그인
        async function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('input-id').value;
            const pw = document.getElementById('input-pw').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, pw })
                });
                const data = await res.json();
                
                if (data.success) {
                    currentUser = data.user;
                    if (currentUser.grade) { viewGrade = currentUser.grade; viewMode = 'CLASS'; }
                    if (currentUser.classNum) { viewClass = currentUser.classNum; viewMode = 'CLASS'; }

                    document.getElementById('login-container').classList.add('hidden');
                    document.getElementById('dashboard-container').classList.remove('hidden');
                    
                    if (currentUser.role === 'PRINCIPAL') {
                        document.getElementById('btn-emergency').classList.remove('hidden');
                    }
                    
                    document.getElementById('user-role-badge').innerText = `${currentUser.name}`;
                    
                    refreshAllData();
                    setInterval(refreshAllData, 3000);
                } else alert('로그인 실패');
            } catch (err) { alert('서버 오류'); }
        }

        async function refreshAllData() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                studentsData = data.students;
                classesData = data.classes;
                renderMainView();
            } catch (err) { console.error('데이터 통신 에러'); }
        }

        function renderMainView() {
            if (viewMode === 'TOTAL') {
                document.getElementById('total-view-panel').classList.remove('hidden');
                document.getElementById('class-view-panel').classList.add('hidden');
                renderTotalGrid();
            } else {
                document.getElementById('total-view-panel').classList.add('hidden');
                document.getElementById('class-view-panel').classList.remove('hidden');
                renderClassView();
            }
        }

        function switchToTotalView() { viewMode = 'TOTAL'; renderMainView(); }
        function goToClass(g, c) { viewGrade = g; viewClass = c; viewMode = 'CLASS'; renderMainView(); }

        // 1️⃣ 관제센터 메인 그리드 렌더링 (학교장 한눈에 보기)
        function renderTotalGrid() {
            const grid = document.getElementById('class-grid');
            grid.innerHTML = '';

            // 필터링: 학년 부장은 자기 학년만, 교장은 전체
            const viewableClasses = currentUser.role === 'GRADE_HEAD' 
                ? classesData.filter(c => c.grade === currentUser.grade) 
                : classesData;

            viewableClasses.forEach(c => {
                const classStudents = studentsData.filter(s => s.grade === c.grade && s.classNum === c.classNum);
                const total = classStudents.length;
                const controlled = classStudents.filter(s => s.status === 'online').length;
                
                // 핵심 기능: 수업 아닐 경우 빨간색 알람 점멸
                const cardStyle = c.isClassOn 
                    ? 'border-slate-700 bg-slate-800 hover:bg-slate-700' 
                    : 'border-rose-500 bg-rose-950/40 shadow-[0_0_15px_rgba(225,29,72,0.3)] animate-pulse';
                
                const statusBadge = c.isClassOn 
                    ? '<span class="px-2 py-1 bg-emerald-500/20 text-emerald-400 text-xs font-bold rounded">🟢 수업 진행중</span>'
                    : '<span class="px-2 py-1 bg-rose-600 text-white text-xs font-bold rounded">🔴 수업 아님</span>';

                grid.innerHTML += `
                    <div onclick="goToClass(${c.grade}, ${c.classNum})" class="rounded-2xl p-5 border-2 ${cardStyle} cursor-pointer transition transform hover:scale-105">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-xl font-bold text-white">${c.grade}학년 ${c.classNum}반</h3>
                            ${statusBadge}
                        </div>
                        <div class="text-sm text-slate-300 mb-4">담임: ${c.teacher}</div>
                        <div class="flex justify-between items-end">
                            <div class="text-slate-400 text-sm">재적: <span class="text-white font-bold">${total}</span>명</div>
                            <div class="text-indigo-300 text-sm">기기통제: <span class="text-indigo-400 text-2xl font-black">${controlled}</span>명</div>
                        </div>
                    </div>
                `;
            });
        }

        // 2️⃣ 학급 상세 (좌석표 및 명렬표)
        function renderClassView() {
            document.getElementById('room-title').innerText = `${viewGrade}학년 ${viewClass}반 관제 상세`;
            const classData = studentsData.filter(s => s.grade === viewGrade && s.classNum === viewClass);
            
            const grid = document.getElementById('seating-chart');
            grid.innerHTML = '';

            // 좌석표 렌더링
            for (let i = 1; i <= totalSeats; i++) {
                const student = classData.find(s => s.seat === i);
                if (student) {
                    const isOnline = student.status === 'online';
                    const isEmergency = student.reason === '🚨긴급 재난 해제';
                    
                    let bgColor = isOnline ? 'bg-indigo-500/20 border-indigo-500/50' : 'bg-slate-700/50 border-slate-600 text-slate-400';
                    if (isEmergency) bgColor = 'bg-rose-500/20 border-rose-500 text-rose-300';
                    
                    let statusText = isOnline ? `<span class="text-indigo-300 font-bold text-[11px]">통제중</span>` 
                                              : `<span class="text-slate-400 font-bold text-[10px]">${student.reason || '이탈/결석'}</span>`;
                    if (isEmergency) statusText = `<span class="text-rose-400 font-bold text-[11px]">해제됨</span>`;

                    grid.innerHTML += `
                        <div class="flex flex-col items-center justify-center p-2 rounded-xl border-2 ${bgColor} aspect-square">
                            <span class="text-[9px] mb-1 font-mono">${student.seat}</span>
                            <span class="font-bold text-sm mb-1">${student.name}</span>
                            ${statusText}
                        </div>
                    `;
                } else {
                    grid.innerHTML += `<div class="flex flex-col items-center justify-center p-2 rounded-xl border-2 border-slate-800 bg-slate-800/30 aspect-square"><span class="text-[9px] text-slate-600">${i}</span></div>`;
                }
            }

            // 우측 명렬표 렌더링
            const tbody = document.getElementById('student-list-body');
            tbody.innerHTML = '';
            
            const controlledCount = classData.filter(s => s.status === 'online').length;
            document.getElementById('class-stats').innerText = `총원 ${classData.length}명 / 통제 ${controlledCount}명`;

            const sorted = [...classData].sort((a, b) => a.seat - b.seat);
            sorted.forEach(s => {
                const isOnline = s.status === 'online';
                const statusBadge = isOnline ? `<span class="text-xs text-indigo-400 font-bold">잠금(통제중)</span>` 
                                             : `<span class="text-xs text-rose-400 font-bold">${s.reason || '결석'}</span>`;
                
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-700/40 border-b border-slate-700/50">
                        <td class="p-3 text-slate-500 font-mono text-xs text-center">${s.seat}</td>
                        <td class="p-3 font-bold text-white">${s.name}</td>
                        <td class="p-3 text-center">${statusBadge}</td>
                        <td class="p-3 text-center">
                            <button onclick="inputReason('${s.id}')" class="text-[11px] bg-slate-700 px-3 py-1.5 rounded text-white hover:bg-slate-600">사유입력</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 제어 액션
        async function inputReason(studentId) {
            const reason = prompt('학생의 결석/이탈 사유를 입력하세요:');
            if (reason) {
                await fetch('/api/reason', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ studentId, reason }) });
                refreshAllData();
            }
        }

        async function triggerEmergency() {
            if (confirm('🚨 긴급 상황입니다.\n전교생의 스마트폰 기기 제어를 즉시 일괄 해제하시겠습니까?')) {
                const res = await fetch('/api/emergency', { method: 'POST' });
                const data = await res.json();
                alert(data.message);
                refreshAllData();
            }
        }

        async function simulateStudentTag() {
            const id = prompt('등교 처리할 학생 ID (s2, s3, s6) 입력:');
            if (id) {
                await fetch('/api/heartbeat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
                refreshAllData();
            }
        }

        async function toggleSetupClass() {
            const target = classesData.find(c => c.grade === viewGrade && c.classNum === viewClass);
            if (target) {
                await fetch('/api/class-status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ grade: viewGrade, classNum: viewClass, isClassOn: !target.isClassOn }) });
                refreshAllData();
            }
        }
    </script>
</body>
</html>
