<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETI 스마트 통합 관제센터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        .seat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.75rem; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- 1️⃣ 퀵 로그인 화면 -->
    <div id="login-container" class="flex h-screen items-center justify-center">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl max-w-lg w-full border border-slate-700">
            <h2 class="text-3xl font-black mb-2 text-center text-white"><i class="fa-solid fa-tower-observation text-indigo-500"></i> 통합 관제센터</h2>
            <p class="text-center text-xs text-slate-400 mb-8">접속하실 교직원 직급(권한)을 선택해 주세요.</p>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="quickLogin('master', '1234')" class="flex flex-col items-center justify-center gap-2 p-5 bg-slate-900 border border-slate-700 rounded-xl hover:border-indigo-500 hover:bg-indigo-900/30 transition group">
                    <i class="fa-solid fa-crown text-3xl text-amber-400 group-hover:scale-110 transition"></i>
                    <span class="font-bold text-sm text-white">학교장 (마스터)</span>
                    <span class="text-[10px] text-slate-500">전교생 총괄 관제</span>
                </button>
                <button onclick="quickLogin('head1', '1234')" class="flex flex-col items-center justify-center gap-2 p-5 bg-slate-900 border border-slate-700 rounded-xl hover:border-blue-500 hover:bg-blue-900/30 transition group">
                    <i class="fa-solid fa-layer-group text-3xl text-blue-400 group-hover:scale-110 transition"></i>
                    <span class="font-bold text-sm text-white">학년 부장</span>
                    <span class="text-[10px] text-slate-500">해당 학년 총괄</span>
                </button>
                <button onclick="quickLogin('room1-1', '1234')" class="flex flex-col items-center justify-center gap-2 p-5 bg-slate-900 border border-slate-700 rounded-xl hover:border-emerald-500 hover:bg-emerald-900/30 transition group">
                    <i class="fa-solid fa-chalkboard-user text-3xl text-emerald-400 group-hover:scale-110 transition"></i>
                    <span class="font-bold text-sm text-white">담임 교사</span>
                    <span class="text-[10px] text-slate-500">학급 상세 제어</span>
                </button>
                <button onclick="quickLogin('subject1', '1234')" class="flex flex-col items-center justify-center gap-2 p-5 bg-slate-900 border border-slate-700 rounded-xl hover:border-purple-500 hover:bg-purple-900/30 transition group">
                    <i class="fa-solid fa-book-open-reader text-3xl text-purple-400 group-hover:scale-110 transition"></i>
                    <span class="font-bold text-sm text-white">교과 교사</span>
                    <span class="text-[10px] text-slate-500">입실 학급 선택</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 2️⃣ 대시보드 메인 화면 -->
    <div id="dashboard-container" class="hidden p-6 max-w-7xl mx-auto space-y-6">
        
        <!-- 상단 헤더 -->
        <header class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-indigo-400"></i> ETI 통합 관제 현황판
                </h1>
                <p id="user-role-badge" class="text-sm text-indigo-300 mt-1 font-bold">사용자 접속 중</p>
            </div>
            <div id="top-controls" class="flex items-center gap-4">
                <!-- JS에서 권한별 컨트롤이 삽입됩니다 -->
            </div>
        </header>

        <!-- [ALL - 전체 상황판 뷰] (학교장, 학년부장 전용) -->
        <div id="total-view-panel" class="hidden space-y-4">
            <h2 class="text-lg font-bold text-slate-300 border-b border-slate-700 pb-2">관할 학급 관제 현황 (클릭 시 상세 이동)</h2>
            <div id="class-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </div>

        <!-- [개별 학급 상세 뷰] -->
        <div id="class-view-panel" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-slate-800 border border-slate-700 rounded-2xl p-6 flex flex-col">
                <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                    <h2 class="font-black text-xl text-white" id="room-title">1학년 1반 관제</h2>
                    <div class="flex gap-2">
                        <button onclick="toggleSetupClass()" class="text-xs bg-slate-700 px-3 py-1.5 rounded text-white hover:bg-slate-600">수업 상태 변경(테스트)</button>
                        <button onclick="simulateStudentTag()" class="text-xs bg-indigo-600 px-3 py-1.5 rounded text-white hover:bg-indigo-500">학생 태그(테스트)</button>
                    </div>
                </div>
                
                <div class="w-full flex justify-center mb-8">
                    <div class="bg-slate-900 text-slate-400 px-16 py-3 rounded-lg font-black text-sm border-b-4 border-slate-700">교 탁</div>
                </div>
                <div id="seating-chart" class="seat-grid w-full max-w-3xl mx-auto flex-1 pb-4"></div>
            </div>

            <!-- 우측 명렬표 -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl flex flex-col overflow-hidden h-[750px]">
                <div class="p-4 border-b border-slate-700 bg-slate-900 flex justify-between items-center">
                    <h3 class="font-bold text-white">학급 명렬 리스트</h3>
                    <span id="class-stats" class="text-xs font-bold text-indigo-300">총 0명</span>
                </div>
                <div class="flex-1 overflow-y-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-900 text-slate-400 sticky top-0 border-b border-slate-700">
                            <tr>
                                <th class="p-3 text-center">번호</th>
                                <th class="p-3">이름</th>
                                <th class="p-3 text-center">기기 상태</th>
                                <th class="p-3 text-center">사유 입력</th>
                            </tr>
                        </thead>
                        <tbody id="student-list-body" class="divide-y divide-slate-700/50 text-slate-200"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let studentsData = [];
        let classesData = [];
        let currentUser = null;
        let viewMode = 'TOTAL'; 
        let viewGrade = 1, viewClass = 1;
        const totalSeats = 25;

        async function quickLogin(id, pw) {
            try {
                const res = await fetch('/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, pw })
                });
                const data = await res.json();
                
                if (data.success) {
                    currentUser = data.user;
                    setupRoleView(); 
                    
                    document.getElementById('login-container').classList.add('hidden');
                    document.getElementById('dashboard-container').classList.remove('hidden');
                    document.getElementById('user-role-badge').innerText = `[${currentUser.name}] 접속 중`;
                    
                    refreshAllData();
                    setInterval(refreshAllData, 3000);
                } else alert('로그인 실패');
            } catch (err) { alert('서버 오류'); }
        }

        function setupRoleView() {
            if (currentUser.role === 'PRINCIPAL' || currentUser.role === 'GRADE_HEAD') {
                viewMode = 'TOTAL'; 
                if(currentUser.role === 'GRADE_HEAD') viewGrade = currentUser.grade;
            } else if (currentUser.role === 'HOMEROOM') {
                viewMode = 'CLASS'; 
                viewGrade = currentUser.grade;
                viewClass = currentUser.classNum;
            } else if (currentUser.role === 'SUBJECT') {
                viewMode = 'CLASS'; 
                viewGrade = 1;
                viewClass = 1;
            }
            renderHeaderControls();
        }

        function renderHeaderControls() {
            const controls = document.getElementById('top-controls');
            let html = '';

            if (currentUser.role === 'SUBJECT') {
                html += `
                    <div class="flex items-center gap-2 bg-slate-900 p-2 rounded-lg border border-slate-700 mr-4">
                        <span class="text-xs text-slate-400">수업 학급:</span>
                        <select onchange="goToClass(this.value, ${viewClass})" class="bg-slate-800 text-white text-sm rounded outline-none p-1">
                            <option value="1" ${viewGrade==1?'selected':''}>1학년</option><option value="2" ${viewGrade==2?'selected':''}>2학년</option><option value="3" ${viewGrade==3?'selected':''}>3학년</option>
                        </select>
                        <select onchange="goToClass(${viewGrade}, this.value)" class="bg-slate-800 text-white text-sm rounded outline-none p-1">
                            <option value="1" ${viewClass==1?'selected':''}>1반</option><option value="2" ${viewClass==2?'selected':''}>2반</option>
                        </select>
                    </div>
                `;
            }

            if (currentUser.role === 'PRINCIPAL') {
                html += `<button onclick="triggerEmergency()" class="px-5 py-2.5 rounded-lg text-sm font-black bg-rose-600 text-white hover:bg-rose-500 shadow-[0_0_15px_rgba(225,29,72,0.5)] transition"><i class="fa-solid fa-unlock-keyhole"></i> 전교생 긴급 해제</button>`;
            }

            if (['PRINCIPAL', 'GRADE_HEAD'].includes(currentUser.role)) {
                html += `<button onclick="switchToTotalView()" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold transition"><i class="fa-solid fa-border-all"></i> 전체 상황판</button>`;
            }

            html += `<button onclick="location.reload()" class="px-3 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-300 transition"><i class="fa-solid fa-power-off"></i></button>`;
            controls.innerHTML = html;
        }

        async function refreshAllData() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                studentsData = data.students;
                classesData = data.classes;
                renderMainView();
            } catch (err) { console.error('데이터 에러'); }
        }

        function renderMainView() {
            if (viewMode === 'TOTAL') {
                document.getElementById('total-view-panel').classList.remove('hidden');
                document.getElementById('class-view-panel').classList.add('hidden');
                renderTotalGrid();
            } else {
                document.getElementById('total-view-panel').classList.add('hidden');
                document.getElementById('class-view-panel').classList.remove('hidden');
                renderClassView();
            }
        }

        function switchToTotalView() { viewMode = 'TOTAL'; renderMainView(); }
        function goToClass(g, c) { viewGrade = Number(g); viewClass = Number(c); viewMode = 'CLASS'; renderHeaderControls(); renderMainView(); }

        function renderTotalGrid() {
            const grid = document.getElementById('class-grid');
            grid.innerHTML = '';

            const viewableClasses = currentUser.role === 'GRADE_HEAD' ? classesData.filter(c => c.grade === currentUser.grade) : classesData;

            viewableClasses.forEach(c => {
                const classStudents = studentsData.filter(s => s.grade === c.grade && s.classNum === c.classNum);
                const total = classStudents.length;
                const controlled = classStudents.filter(s => s.status === 'online').length;
                
                const cardStyle = c.isClassOn ? 'border-slate-700 bg-slate-800 hover:bg-slate-700' : 'border-rose-500 bg-rose-950/40 shadow-[0_0_15px_rgba(225,29,72,0.3)] animate-pulse';
                const statusBadge = c.isClassOn ? '<span class="px-2 py-1 bg-emerald-500/20 text-emerald-400 text-xs font-bold rounded">🟢 수업 진행중</span>' : '<span class="px-2 py-1 bg-rose-600 text-white text-xs font-bold rounded">🔴 수업 아님</span>';

                grid.innerHTML += `
                    <div onclick="goToClass(${c.grade}, ${c.classNum})" class="rounded-2xl p-5 border-2 ${cardStyle} cursor-pointer transition transform hover:scale-105">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-xl font-bold text-white">${c.grade}학년 ${c.classNum}반</h3>
                            ${statusBadge}
                        </div>
                        <div class="text-sm text-slate-300 mb-4">담임: ${c.teacher}</div>
                        <div class="flex justify-between items-end">
                            <div class="text-slate-400 text-sm">재적: <span class="text-white font-bold">${total}</span>명</div>
                            <div class="text-indigo-300 text-sm">기기통제: <span class="text-indigo-400 text-2xl font-black">${controlled}</span>명</div>
                        </div>
                    </div>
                `;
            });
        }

        function renderClassView() {
            document.getElementById('room-title').innerText = `${viewGrade}학년 ${viewClass}반 관제 상세`;
            const classData = studentsData.filter(s => s.grade === viewGrade && s.classNum === viewClass);
            
            const grid = document.getElementById('seating-chart');
            grid.innerHTML = '';

            for (let i = 1; i <= totalSeats; i++) {
                const student = classData.find(s => s.seat === i);
                if (student) {
                    const isOnline = student.status === 'online';
                    const isEmergency = student.reason === '🚨긴급 재난 해제';
                    
                    let bgColor = isOnline ? 'bg-indigo-500/20 border-indigo-500/50' : 'bg-slate-700/50 border-slate-600 text-slate-400';
                    if (isEmergency) bgColor = 'bg-rose-500/20 border-rose-500 text-rose-300';
                    
                    let statusText = isOnline ? `<span class="text-indigo-300 font-bold text-[11px]">통제중</span>` : `<span class="text-slate-400 font-bold text-[10px]">${student.reason || '이탈/결석'}</span>`;
                    if (isEmergency) statusText = `<span class="text-rose-400 font-bold text-[11px]">해제됨</span>`;

                    grid.innerHTML += `
                        <div class="flex flex-col items-center justify-center p-2 rounded-xl border-2 ${bgColor} aspect-square">
                            <span class="text-[9px] mb-1 font-mono">${student.seat}</span>
                            <span class="font-bold text-sm mb-1">${student.name}</span>
                            ${statusText}
                        </div>
                    `;
                } else {
                    grid.innerHTML += `<div class="flex flex-col items-center justify-center p-2 rounded-xl border-2 border-slate-800 bg-slate-800/30 aspect-square"><span class="text-[9px] text-slate-600">${i}</span></div>`;
                }
            }

            const tbody = document.getElementById('student-list-body');
            tbody.innerHTML = '';
            const controlledCount = classData.filter(s => s.status === 'online').length;
            document.getElementById('class-stats').innerText = `총원 ${classData.length}명 / 통제 ${controlledCount}명`;

            const sorted = [...classData].sort((a, b) => a.seat - b.seat);
            sorted.forEach(s => {
                const isOnline = s.status === 'online';
                const statusBadge = isOnline ? `<span class="text-xs text-indigo-400 font-bold">잠금(통제중)</span>` : `<span class="text-xs text-rose-400 font-bold">${s.reason || '결석'}</span>`;
                const reasonBtn = currentUser.role === 'SUBJECT' ? '-' : `<button onclick="inputReason('${s.id}')" class="text-[11px] bg-slate-700 px-3 py-1.5 rounded text-white hover:bg-slate-600">사유입력</button>`;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-700/40 border-b border-slate-700/50">
                        <td class="p-3 text-slate-500 font-mono text-xs text-center">${s.seat}</td>
                        <td class="p-3 font-bold text-white">${s.name}</td>
                        <td class="p-3 text-center">${statusBadge}</td>
                        <td class="p-3 text-center">${reasonBtn}</td>
                    </tr>
                `;
            });
        }

        async function inputReason(studentId) {
            const reason = prompt('학생의 결석/이탈 사유를 입력하세요:');
            if (reason) {
                await fetch('/api/reason', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ studentId, reason }) });
                refreshAllData();
            }
        }

        async function triggerEmergency() {
            if (confirm('🚨 긴급 상황입니다.\n전교생의 스마트폰 기기 제어를 즉시 일괄 해제하시겠습니까?')) {
                const res = await fetch('/api/emergency', { method: 'POST' });
                const data = await res.json();
                alert(data.message);
                refreshAllData();
            }
        }

        async function simulateStudentTag() {
            const id = prompt('출석 처리할 학생 ID (s2, s3, s6) 입력:');
            if (id) {
                await fetch('/api/heartbeat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
                refreshAllData();
            }
        }

        async function toggleSetupClass() {
            const target = classesData.find(c => c.grade === viewGrade && c.classNum === viewClass);
            if (target) {
                await fetch('/api/class-status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ grade: viewGrade, classNum: viewClass, isClassOn: !target.isClassOn }) });
                refreshAllData();
            }
        }
    </script>
</body>
</html>
