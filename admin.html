<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETI 스마트 학교 통합 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        .seat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.75rem; }
        .ticker-wrap { width: 100%; overflow: hidden; background-color: #1e293b; padding: 0.5rem 0; border-bottom: 1px solid #334155; }
        .ticker { display: inline-block; white-space: nowrap; animation: ticker 25s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .emergency-btn { animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); } 100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <!-- 상단 라이브 이벤트 티커 (상용 서비스 느낌) -->
    <div id="live-ticker" class="ticker-wrap text-xs font-bold text-slate-300 flex items-center hidden">
        <div class="px-4 text-emerald-400 z-10 bg-slate-800 font-black border-r border-slate-700">LIVE 실시간 관제</div>
        <div class="ticker w-full" id="ticker-content">
            <!-- JS 동적 메시지 삽입 -->
        </div>
    </div>

    <!-- 로그인 화면 -->
    <div id="login-container" class="flex flex-1 items-center justify-center">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-700 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
            
            <h2 class="text-3xl font-black mb-2 text-center text-white flex justify-center items-center gap-3">
                <i class="fa-solid fa-shield-halved text-indigo-500"></i> ETI SYSTEM
            </h2>
            <p class="text-center text-xs text-slate-400 mb-8 font-semibold">스마트 디바이스 및 학생 출결 통합 제어 솔루션</p>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                    <input type="text" id="input-id" value="master" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition" placeholder="교직원 ID" required>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                    <input type="password" id="input-pw" value="1234" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition" placeholder="비밀번호" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-xl shadow-lg transition transform active:scale-95 mt-2">
                    관리자 시스템 접속
                </button>
            </form>
        </div>
    </div>

    <!-- 대시보드 메인 화면 -->
    <div id="dashboard-container" class="hidden p-6 max-w-[1600px] mx-auto w-full flex-1 space-y-6">
        
        <!-- 상단 헤더 & 컨트롤 패널 -->
        <header class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl flex flex-col md:flex-row justify-between md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-black flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-indigo-400"></i> ETI 스마트 관제 센터
                </h1>
                <p id="user-role-badge" class="text-sm text-indigo-300 mt-1 font-bold">사용자 권한</p>
            </div>
            
            <div id="navigation-bar" class="flex flex-col md:items-end gap-3">
                <!-- JS 동적 메뉴 렌더링 -->
            </div>
        </header>

        <!-- 1️⃣ [ALL - 전교생 총괄 뷰] -->
        <div id="total-view-panel" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- 요약 카드 1 -->
                <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-400 mb-1">현재 전교 미출석/조퇴 현황</p>
                        <h3 id="stat-absent" class="text-3xl font-black text-rose-400">0명</h3>
                    </div>
                    <div class="w-14 h-14 rounded-full bg-rose-500/10 flex items-center justify-center text-rose-500 text-2xl"><i class="fa-solid fa-user-xmark"></i></div>
                </div>
                
                <!-- 요약 카드 2: 보상 시스템 (특허/기획안 반영) -->
                <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-400 mb-1">지급된 총 누적 출석 보상 캐시</p>
                        <h3 id="stat-cash" class="text-3xl font-black text-amber-400">0 ₩</h3>
                    </div>
                    <div class="w-14 h-14 rounded-full bg-amber-500/10 flex items-center justify-center text-amber-500 text-2xl"><i class="fa-solid fa-coins"></i></div>
                </div>

                <!-- 요약 카드 3: 학부모 알림 -->
                <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-400 mb-1">학부모 실시간 앱/SMS 알림율</p>
                        <h3 id="stat-noti" class="text-3xl font-black text-emerald-400">100%</h3>
                    </div>
                    <div class="w-14 h-14 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-500 text-2xl"><i class="fa-solid fa-comment-sms"></i></div>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-4">
                    <h2 class="text-lg font-bold text-rose-400 flex items-center gap-2">
                        <i class="fa-solid fa-clipboard-list"></i> 전교 미출석 / 조퇴 학생 종합 명단
                    </h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-900 text-slate-400 border-b border-slate-700">
                            <tr>
                                <th class="p-4">소속</th>
                                <th class="p-4">학생 이름</th>
                                <th class="p-4">미출석/기기제어 상태</th>
                                <th class="p-4">담임 교사</th>
                                <th class="p-4">학부모 알림</th>
                                <th class="p-4 text-center">사유 입력</th>
                            </tr>
                        </thead>
                        <tbody id="total-absent-table-body" class="divide-y divide-slate-700/50 text-slate-200">
                            <!-- JS 동적 생성 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 2️⃣ [개별 학급 교실 뷰] -->
        <div id="class-view-panel" class="grid grid-cols-1 xl:grid-cols-3 gap-6">
            
            <!-- ⬅️ 교실 좌석 배치도 -->
            <div class="xl:col-span-2 bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col">
                <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                    <h2 class="font-black text-xl text-white" id="room-title">1학년 1반 교실 좌석표</h2>
                    <div class="flex gap-2">
                        <button onclick="simulateStudentTag()" class="text-xs bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 px-3 py-1.5 rounded-lg hover:bg-indigo-600/50 font-bold">
                            <i class="fa-solid fa-id-card-clip"></i> 학생 RFID 태그 테스트
                        </button>
                    </div>
                </div>
                
                <div class="w-full flex justify-center mb-8">
                    <div class="bg-slate-900 text-slate-400 px-16 py-3 rounded-xl font-black text-sm shadow-inner border-b-4 border-slate-700 tracking-widest">
                        교 탁 (앞)
                    </div>
                </div>

                <div id="seating-chart" class="seat-grid w-full max-w-4xl mx-auto flex-1 pb-4">
                    <!-- JS 동적 생성 -->
                </div>
            </div>

            <!-- ➡️ 우측 명렬표 및 보상 현황 -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl flex flex-col shadow-xl overflow-hidden h-[850px]">
                <div class="p-5 border-b border-slate-700 bg-slate-900 flex justify-between items-center">
                    <h3 class="font-bold text-white"><i class="fa-solid fa-address-book text-indigo-400"></i> 학급 명렬 및 보상 캐시</h3>
                    <span id="class-stats" class="text-xs font-bold bg-indigo-500/20 text-indigo-300 px-2.5 py-1 rounded-lg">총 0명</span>
                </div>
                <div class="flex-1 overflow-y-auto custom-scrollbar">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-900/90 backdrop-blur text-slate-400 sticky top-0 border-b border-slate-700 shadow-sm z-10">
                            <tr>
                                <th class="p-3 text-center">번호</th>
                                <th class="p-3">이름</th>
                                <th class="p-3 text-center">제어 상태</th>
                                <th class="p-3 text-right">출결 캐시</th>
                                <th class="p-3 text-center">알림</th>
                            </tr>
                        </thead>
                        <tbody id="student-list-body" class="divide-y divide-slate-700/50 text-slate-200">
                            <!-- JS 동적 생성 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 📊 [모달] 교사 월간 평가표 -->
    <div id="report-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <!-- 생략 (기존과 동일한 모달 구조 적용 가능. 생략시 기능 저하 없도록 껍데기만 남김) -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-2xl shadow-2xl relative">
            <h3 class="text-lg font-bold text-white mb-4">교사 출결 다운로드</h3>
            <button onclick="document.getElementById('report-modal').classList.add('hidden')" class="px-4 py-2 bg-slate-600 rounded text-white">닫기</button>
        </div>
    </div>

    <script>
        let studentsData = [];
        let currentUser = null;
        let viewMode = 'TOTAL'; 
        let viewGrade = 1; 
        let viewClass = 1;
        const totalSeats = 25;

        // 로그인 처리
        async function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('input-id').value;
            const pw = document.getElementById('input-pw').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, pw })
                });
                const data = await res.json();
                
                if (data.success) {
                    currentUser = data.user;
                    if (currentUser.grade) { viewGrade = currentUser.grade; viewMode = 'CLASS'; }
                    if (currentUser.classNum) { viewClass = currentUser.classNum; viewMode = 'CLASS'; }

                    document.getElementById('login-container').classList.add('hidden');
                    document.getElementById('dashboard-container').classList.remove('hidden');
                    document.getElementById('dashboard-container').classList.add('flex');
                    document.getElementById('live-ticker').classList.remove('hidden');
                    
                    setupDashboard();
                    refreshAllData();
                    setInterval(refreshAllData, 3000);
                } else alert('로그인 실패');
            } catch (err) { alert('서버 연결 오류'); }
        }

        function setupDashboard() {
            document.getElementById('user-role-badge').innerText = `${currentUser.name} 접속 중 (보안 레벨: ${currentUser.role})`;
            renderNavigation();
        }

        function renderNavigation() {
            const nav = document.getElementById('navigation-bar');
            nav.innerHTML = '';
            let html = '<div class="flex flex-wrap gap-2 items-center">';

            // 1. ALL 버튼
            if (['PRINCIPAL', 'GRADE_HEAD'].includes(currentUser.role)) {
                const isAllActive = viewMode === 'TOTAL' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 font-black' : 'bg-slate-700 text-slate-300 hover:bg-slate-600';
                html += `<button onclick="switchToTotalView()" class="px-5 py-2.5 rounded-xl text-sm transition ${isAllActive}"><i class="fa-solid fa-chart-line"></i> 대시보드 총괄</button>`;
            }

            // 2. 학년 버튼
            if (['PRINCIPAL', 'SUBJECT'].includes(currentUser.role)) {
                [1, 2, 3].forEach(g => {
                    const active = (viewMode === 'CLASS' && g === viewGrade) ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'bg-slate-700 text-slate-300 hover:bg-slate-600';
                    html += `<button onclick="changeGrade(${g})" class="px-4 py-2.5 rounded-xl text-sm font-bold transition ${active}">${g}학년</button>`;
                });
            }

            // 3. 🚨 긴급 재난 해제 버튼 (마스터 전용 - 특허 주요 기능)
            if (currentUser.role === 'PRINCIPAL') {
                html += `<button onclick="triggerEmergency()" class="emergency-btn px-5 py-2.5 rounded-xl text-sm font-black bg-rose-600 text-white hover:bg-rose-500 transition ml-4"><i class="fa-solid fa-triangle-exclamation"></i> 긴급 재난 해제</button>`;
            }

            html += '</div>';

            // 4. 반 버튼
            if (viewMode === 'CLASS' && ['PRINCIPAL', 'GRADE_HEAD', 'SUBJECT'].includes(currentUser.role)) {
                html += '<div class="flex gap-2 mt-2 justify-end">';
                [1, 2, 3, 4, 5].forEach(c => {
                    const active = c === viewClass ? 'bg-indigo-500 text-white shadow-md' : 'bg-slate-700 text-slate-300 hover:bg-slate-600';
                    html += `<button onclick="changeClass(${c})" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${active}">${c}반</button>`;
                });
                html += '</div>';
            }
            nav.innerHTML = html;
        }

        function switchToTotalView() { viewMode = 'TOTAL'; renderNavigation(); renderMainView(); }
        function changeGrade(g) { viewMode = 'CLASS'; viewGrade = g; viewClass = 1; renderNavigation(); renderMainView(); }
        function changeClass(c) { viewMode = 'CLASS'; viewClass = c; renderNavigation(); renderMainView(); }

        // 티커 메시지 업데이트
        function updateTicker() {
            const ticker = document.getElementById('ticker-content');
            const absents = studentsData.filter(s => s.status === 'offline');
            const messages = absents.map(s => `[${s.grade}학년 ${s.classNum}반 ${s.name}] ${s.reason || '결석'} - 학부모 알림 발송 완료`).join(' &nbsp;&nbsp; | &nbsp;&nbsp; ');
            ticker.innerHTML = messages || '현재 전교생 정상 출석 및 기기 제어 연동 중입니다.';
        }

        async function refreshAllData() {
            try {
                const res = await fetch('/api/students');
                studentsData = await res.json();
                
                updateTicker();
                renderMainView();
            } catch (err) { console.error('데이터 수신 실패'); }
        }

        function renderMainView() {
            const totalPanel = document.getElementById('total-view-panel');
            const classPanel = document.getElementById('class-view-panel');

            if (viewMode === 'TOTAL') {
                totalPanel.classList.remove('hidden');
                classPanel.classList.add('hidden');
                renderTotalAbsentTable();
            } else {
                totalPanel.classList.add('hidden');
                classPanel.classList.remove('hidden');
                renderClassView();
            }
        }

        // 1️⃣ ALL 뷰 (상단 요약 통계 및 미출석 리스트)
        function renderTotalAbsentTable() {
            const tbody = document.getElementById('total-absent-table-body');
            tbody.innerHTML = '';

            const absents = studentsData.filter(s => s.status === 'offline');
            const totalCash = studentsData.reduce((sum, s) => sum + (s.cash || 0), 0);

            // 통계 업데이트
            document.getElementById('stat-absent').innerText = `${absents.length}명`;
            document.getElementById('stat-cash').innerText = `${totalCash.toLocaleString()} ₩`;

            if (absents.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500 font-bold">전교생 기기 제어 정상 연동 및 출석 중입니다.</td></tr>`;
                return;
            }

            absents.forEach(s => {
                const notiBadge = s.parentNoti.includes('완료') || s.parentNoti.includes('긴급') 
                    ? `<span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded border border-emerald-500/30">발송성공</span>` 
                    : `<span class="text-[10px] bg-amber-500/20 text-amber-400 px-2 py-1 rounded">대기중</span>`;

                const reasonBadge = s.reason === '🚨긴급 재난 해제' 
                    ? `<span class="text-xs bg-rose-600 text-white px-2 py-1 rounded font-bold">${s.reason}</span>`
                    : `<span class="text-xs bg-rose-500/10 text-rose-400 px-2.5 py-1 rounded font-bold border border-rose-500/20">${s.reason || '기기 이탈 (결석)'}</span>`;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-700/40 transition border-b border-slate-700/50">
                        <td class="p-4 font-bold text-indigo-400">${s.grade}학년 ${s.classNum}반</td>
                        <td class="p-4 font-bold text-white flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-slate-700 flex justify-center items-center text-xs text-slate-300 border border-slate-600">${s.name.charAt(0)}</div>
                            ${s.name} <span class="text-xs text-slate-500 font-normal">(${s.seat}번)</span>
                        </td>
                        <td class="p-4">${reasonBadge}</td>
                        <td class="p-4 text-slate-300 font-medium">${s.homeroomTeacher}</td>
                        <td class="p-4">${notiBadge}</td>
                        <td class="p-4 text-center">
                            <button onclick="inputReason('${s.id}')" class="text-[11px] bg-slate-700 px-3 py-2 rounded-lg text-slate-200 hover:bg-slate-600 font-bold shadow-sm">사유입력</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 2️⃣ 개별 학급 뷰
        function renderClassView() {
            document.getElementById('room-title').innerHTML = `${viewGrade}학년 ${viewClass}반 <span class="text-sm font-normal text-indigo-400 ml-2">스마트 기기 제어 현황</span>`;
            const classData = studentsData.filter(s => s.grade === viewGrade && s.classNum === viewClass);
            renderSeatingChart(classData);
            renderList(classData);
        }

        function renderSeatingChart(classData) {
            const grid = document.getElementById('seating-chart');
            grid.innerHTML = '';

            for (let i = 1; i <= totalSeats; i++) {
                const student = classData.find(s => s.seat === i);
                if (student) {
                    const isOnline = student.status === 'online';
                    const isEmergency = student.reason === '🚨긴급 재난 해제';
                    
                    let bgColor = isOnline ? 'bg-emerald-500/10 border-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.1)]' : 'bg-rose-500/10 border-rose-500/50';
                    if(isEmergency) bgColor = 'bg-rose-600/30 border-rose-500 shadow-[0_0_20px_rgba(225,29,72,0.5)] animate-pulse';

                    const nameColor = (isOnline || isEmergency) ? 'text-white' : 'text-rose-300';
                    
                    let statusText = isOnline 
                        ? `<span class="text-emerald-400 font-black text-[11px]"><i class="fa-solid fa-lock"></i> 기기 통제중</span>` 
                        : `<span class="text-rose-400 font-bold text-[10px] truncate w-full text-center px-1">${student.reason || '이탈/결석'}</span>`;
                    
                    if(isEmergency) statusText = `<span class="text-rose-300 font-black text-[11px]"><i class="fa-solid fa-unlock"></i> 통제 해제</span>`;

                    grid.innerHTML += `
                        <div class="flex flex-col items-center justify-center p-3 rounded-2xl border-2 ${bgColor} aspect-square transition hover:scale-105 cursor-pointer relative overflow-hidden">
                            <span class="absolute top-1 left-2 text-[9px] text-slate-500 font-mono">${student.seat}</span>
                            <span class="font-black text-sm mb-1 mt-2 ${nameColor}">${student.name}</span>
                            ${statusText}
                        </div>
                    `;
                } else {
                    grid.innerHTML += `
                        <div class="flex flex-col items-center justify-center p-2 rounded-2xl border-2 border-slate-700/50 bg-slate-800/30 aspect-square">
                            <span class="text-[9px] text-slate-600">${i}</span>
                            <span class="text-[11px] text-slate-600 font-bold mt-1">공석</span>
                        </div>
                    `;
                }
            }
        }

        function renderList(classData) {
            const tbody = document.getElementById('student-list-body');
            tbody.innerHTML = '';
            const onlineCount = classData.filter(s => s.status === 'online').length;
            document.getElementById('class-stats').innerText = `총 ${classData.length}명 / 통제중 ${onlineCount}명`;

            const sorted = [...classData].sort((a, b) => a.seat - b.seat);
            sorted.forEach(s => {
                const isOnline = s.status === 'online';
                const statusBadge = isOnline 
                    ? `<span class="text-xs text-emerald-400 font-bold"><i class="fa-solid fa-lock mr-1"></i>제어중</span>` 
                    : `<span class="text-xs text-rose-400 font-bold">${s.reason || '미접속'}</span>`;
                
                const notiIcon = s.parentNoti.includes('완료') || s.parentNoti.includes('긴급') ? '<i class="fa-solid fa-check text-emerald-400"></i>' : '<i class="fa-solid fa-spinner text-slate-500"></i>';

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-700/50 transition">
                        <td class="p-3 text-slate-500 font-mono text-xs text-center">${s.seat}</td>
                        <td class="p-3 font-bold text-white">${s.name}</td>
                        <td class="p-3 text-center">${statusBadge}</td>
                        <td class="p-3 text-right font-mono text-amber-400 font-bold">${s.cash.toLocaleString()} <i class="fa-solid fa-c text-xs"></i></td>
                        <td class="p-3 text-center text-[10px]">${notiIcon}</td>
                    </tr>
                `;
            });
        }

        async function inputReason(studentId) {
            const reason = prompt('학생의 결석/조퇴 등 사유를 입력하세요 (부모님께 자동 알림됨):');
            if (reason) {
                await fetch('/api/reason', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ studentId, reason }) });
                refreshAllData();
            }
        }

        // 🚨 긴급 재난 기능 (마스터 전용)
        async function triggerEmergency() {
            if (confirm('⚠️ [경고] 전교생의 스마트 기기 제어를 일괄 해제하시겠습니까?\n이 작업은 학부모에게 긴급 알림 문자를 발송합니다.')) {
                const res = await fetch('/api/emergency', { method: 'POST' });
                const data = await res.json();
                alert(data.message);
                refreshAllData();
            }
        }

        // 💳 RFID 시뮬레이터
        async function simulateStudentTag() {
            const id = prompt('등교 처리할 학생 ID (s2, s3, s6 등)를 입력하세요:\n(출결 캐시 +50 적립 및 학부모 알림 발송됨)');
            if (id) {
                await fetch('/api/heartbeat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
                alert('RFID 태그 완료 - 학부모 알림 발송됨');
                refreshAllData();
            }
        }
    </script>
</body>
</html>
