<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 학급 총괄 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- 로그인 화면 -->
    <div id="login-container" class="flex h-screen items-center justify-center flex-col gap-6">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-xl max-w-sm w-full border border-slate-700">
            <h2 class="text-2xl font-bold mb-6 text-center text-white"><i class="fa-solid fa-school text-indigo-400"></i> 교직원 로그인</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="text" id="input-id" value="master" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:border-indigo-500 outline-none" placeholder="아이디" required>
                <input type="password" id="input-pw" value="1234" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:border-indigo-500 outline-none" placeholder="비밀번호" required>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-3 rounded-lg shadow-lg">시스템 접속</button>
            </form>
        </div>
        
        <!-- 테스트 안내 박스 -->
        <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl text-xs text-slate-400 max-w-sm w-full">
            <div class="font-bold text-slate-300 mb-2">💡 권한별 테스트 ID (비밀번호: 1234)</div>
            <ul class="space-y-1">
                <li><b class="text-indigo-400">master</b> : 학교장 (전교생 총괄)</li>
                <li><b class="text-indigo-400">head1</b> : 1학년 총괄부장 (1학년 전체)</li>
                <li><b class="text-indigo-400">room1-1</b> : 담임 교사 (1학년 1반만 제어/사유입력)</li>
                <li><b class="text-indigo-400">subject1</b> : 교과 교사 (수업할 반 선택/벌점부여)</li>
            </ul>
        </div>
    </div>

    <!-- 대시보드 화면 -->
    <div id="dashboard-container" class="hidden p-6 max-w-7xl mx-auto space-y-6">
        
        <!-- 상단 헤더 -->
        <header class="flex flex-wrap justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 gap-4">
            <div>
                <h1 id="dashboard-title" class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-chart-pie text-indigo-400"></i> 학급 관리 대시보드</h1>
                <p id="user-role-badge" class="text-sm text-indigo-300 mt-1 font-semibold">로그인 권한 표시</p>
            </div>
            
            <!-- 교과 교사용 반 선택기 (교과 교사에게만 보임) -->
            <div id="subject-teacher-controls" class="hidden items-center gap-2 bg-slate-900 p-2 rounded-lg border border-slate-700">
                <span class="text-xs text-slate-400">현재 수업 반 설정:</span>
                <select id="select-grade" onchange="renderDashboard()" class="bg-slate-800 text-white text-sm rounded p-1 border border-slate-600 outline-none">
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3">3학년</option>
                </select>
                <select id="select-class" onchange="renderDashboard()" class="bg-slate-800 text-white text-sm rounded p-1 border border-slate-600 outline-none">
                    <option value="1">1반</option>
                    <option value="2">2반</option>
                    <option value="3">3반</option>
                </select>
            </div>

            <div class="flex items-center gap-4">
                <span class="text-sm bg-slate-900 px-3 py-1 rounded-full text-indigo-300 border border-slate-700" id="current-time">00:00</span>
                <button onclick="location.reload()" class="text-sm bg-slate-700 px-3 py-1.5 rounded text-white hover:bg-slate-600 transition">로그아웃</button>
            </div>
        </header>

        <!-- 총괄 요약 브리핑 카드 구역 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="summary-cards">
            <!-- JS 동적 생성 -->
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 미참여 사유 리스트 (왼쪽) -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col h-full">
                <h3 class="font-bold text-rose-400 mb-4 border-b border-slate-700 pb-2">
                    <i class="fa-solid fa-clipboard-user"></i> 수업 불참(결석) 현황
                </h3>
                <ul id="absent-reason-list" class="space-y-3 overflow-y-auto pr-2 flex-1"></ul>
            </div>

            <!-- 학생 상세 테이블 (오른쪽 2칸) -->
            <div class="lg:col-span-2 bg-slate-800 border border-slate-700 rounded-xl overflow-hidden flex flex-col">
                <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                    <h3 class="font-bold text-white">학생별 상세 데이터 관리</h3>
                </div>
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-900 text-slate-400 border-b border-slate-700">
                            <tr>
                                <th class="p-3">소속</th>
                                <th class="p-3">이름</th>
                                <th class="p-3">출결 상태</th>
                                <th class="p-3">결석 사유</th>
                                <th class="p-3">벌점</th>
                                <th class="p-3 text-center">학생 관리</th>
                            </tr>
                        </thead>
                        <tbody id="student-table-body" class="divide-y divide-slate-700/50">
                            <!-- JS 동적 생성 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let studentsData = [];
        let currentUser = null;

        setInterval(() => document.getElementById('current-time').innerText = new Date().toLocaleTimeString('ko-KR'), 1000);

        async function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('input-id').value;
            const pw = document.getElementById('input-pw').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, pw })
                });
                const data = await res.json();
                
                if (data.success) {
                    currentUser = data.user;
                    setupDashboardForRole();
                    document.getElementById('login-container').classList.add('hidden');
                    document.getElementById('dashboard-container').classList.remove('hidden');
                    
                    fetchStudents();
                    setInterval(fetchStudents, 3000);
                } else alert(data.message);
            } catch (err) { alert('서버 연결 오류'); }
        }

        // 로그인 권한에 따라 대시보드 기본 세팅
        function setupDashboardForRole() {
            const roleBadge = document.getElementById('user-role-badge');
            const title = document.getElementById('dashboard-title');
            roleBadge.innerText = `${currentUser.name} 접속 중`;

            if (currentUser.role === 'PRINCIPAL') {
                title.innerHTML = `<i class="fa-solid fa-crown text-amber-400"></i> 전교생 총괄 브리핑 (학교장)`;
            } else if (currentUser.role === 'GRADE_HEAD') {
                title.innerHTML = `<i class="fa-solid fa-layer-group text-blue-400"></i> ${currentUser.grade}학년 총괄 브리핑`;
            } else if (currentUser.role === 'HOMEROOM') {
                title.innerHTML = `<i class="fa-solid fa-chalkboard-user text-emerald-400"></i> ${currentUser.grade}학년 ${currentUser.classNum}반 학급 관리`;
            } else if (currentUser.role === 'SUBJECT') {
                title.innerHTML = `<i class="fa-solid fa-book-open text-purple-400"></i> 교과 수업 실시간 제어`;
                document.getElementById('subject-teacher-controls').classList.remove('hidden');
                document.getElementById('subject-teacher-controls').classList.add('flex');
            }
        }

        async function fetchStudents() {
            try {
                const res = await fetch('/api/students');
                studentsData = await res.json();
                renderDashboard();
            } catch (err) { console.error('데이터 에러'); }
        }

        // 현재 권한에 맞게 데이터 필터링
        function getFilteredStudents() {
            if (currentUser.role === 'PRINCIPAL') return studentsData;
            if (currentUser.role === 'GRADE_HEAD') return studentsData.filter(s => s.grade === currentUser.grade);
            if (currentUser.role === 'HOMEROOM') return studentsData.filter(s => s.grade === currentUser.grade && s.classNum === currentUser.classNum);
            if (currentUser.role === 'SUBJECT') {
                const tg = Number(document.getElementById('select-grade').value);
                const tc = Number(document.getElementById('select-class').value);
                return studentsData.filter(s => s.grade === tg && s.classNum === tc);
            }
            return [];
        }

        function renderDashboard() {
            const filteredData = getFilteredStudents();
            renderSummaryCards(filteredData);
            renderAbsentList(filteredData);
            renderTable(filteredData);
        }

        // 1. 요약 카드 (교장: 1~3학년 전부 / 부장: 해당학년만 / 담임,교과: 해당반만)
        function renderSummaryCards(filteredData) {
            const container = document.getElementById('summary-cards');
            container.innerHTML = '';
            
            const createCard = (title, total, online) => `
                <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl shadow-lg">
                    <div class="text-sm font-bold text-slate-400 mb-1">${title}</div>
                    <div class="text-xl font-bold text-white">총 ${total}명 중 <span class="text-emerald-400">${online}명</span> 출석</div>
                </div>
            `;

            if (currentUser.role === 'PRINCIPAL') {
                [1, 2, 3].forEach(g => {
                    const group = filteredData.filter(s => s.grade === g);
                    container.innerHTML += createCard(`${g}학년 전체 현황`, group.length, group.filter(s => s.status === 'online').length);
                });
            } else if (currentUser.role === 'GRADE_HEAD') {
                const online = filteredData.filter(s => s.status === 'online').length;
                container.innerHTML += createCard(`${currentUser.grade}학년 전체 현황`, filteredData.length, online);
            } else {
                const targetText = currentUser.role === 'HOMEROOM' ? '우리 반 수업 참여' : '현재 수업 반 출결';
                const online = filteredData.filter(s => s.status === 'online').length;
                container.innerHTML += createCard(targetText, filteredData.length, online);
            }
        }

        // 2. 미참여(결석) 리스트
        function renderAbsentList(filteredData) {
            const list = document.getElementById('absent-reason-list');
            list.innerHTML = '';
            const absents = filteredData.filter(s => s.status === 'offline');
            
            if (absents.length === 0) return list.innerHTML = '<li class="text-slate-500 text-sm">전원 출석 중입니다.</li>';

            absents.forEach(s => {
                const canEditReason = ['PRINCIPAL', 'GRADE_HEAD', 'HOMEROOM'].includes(currentUser.role);
                list.innerHTML += `
                    <li class="bg-slate-900 border border-slate-700 p-3 rounded-lg flex flex-col gap-1">
                        <div class="flex justify-between items-center">
                            <span class="text-sm font-bold text-slate-200">${s.grade}학년 ${s.classNum}반 ${s.name}</span>
                            ${canEditReason ? `<button onclick="inputReason('${s.id}')" class="text-[10px] bg-slate-700 px-2 py-1 rounded text-slate-300 hover:bg-slate-600">사유 변경</button>` : ''}
                        </div>
                        <span class="text-xs text-rose-400 font-bold"><i class="fa-solid fa-arrow-right"></i> ${s.reason || '사유 미상'}</span>
                    </li>
                `;
            });
        }

        // 3. 메인 테이블 (권한에 따라 버튼 보이기/숨기기)
        function renderTable(filteredData) {
            const tbody = document.getElementById('student-table-body');
            tbody.innerHTML = '';

            filteredData.forEach(s => {
                const isOnline = s.status === 'online';
                // 권한별 버튼 허용 여부
                const canEditReason = ['PRINCIPAL', 'GRADE_HEAD', 'HOMEROOM'].includes(currentUser.role);
                const canGivePenalty = ['PRINCIPAL', 'HOMEROOM', 'SUBJECT'].includes(currentUser.role);

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-700/30 transition">
                        <td class="p-3 text-slate-300 text-xs">${s.grade}-${s.classNum}</td>
                        <td class="p-3 font-bold text-white">${s.name}</td>
                        <td class="p-3">
                            ${isOnline ? `<span class="text-xs text-emerald-400 bg-emerald-400/10 px-2 py-1 rounded">출석</span>` 
                                       : `<span class="text-xs text-rose-400 bg-rose-400/10 px-2 py-1 rounded">결석/이탈</span>`}
                        </td>
                        <td class="p-3 text-xs text-slate-400">${s.reason || '-'}</td>
                        <td class="p-3 font-bold ${s.penalty > 0 ? 'text-amber-400' : 'text-slate-500'}">${s.penalty}점</td>
                        <td class="p-3 text-center space-x-1">
                            ${canEditReason ? `<button onclick="inputReason('${s.id}')" class="text-[11px] bg-slate-700 px-2 py-1.5 rounded hover:bg-slate-600 text-white">사유</button>` : ''}
                            ${canGivePenalty ? `<button onclick="givePenalty('${s.id}')" class="text-[11px] bg-amber-600/20 px-2 py-1.5 rounded hover:bg-amber-600/40 text-amber-400">벌점</button>` : ''}
                        </td>
                    </tr>
                `;
            });
        }

        async function inputReason(studentId) {
            const reason = prompt('결석/조퇴/병가 등 사유를 입력하세요:');
            if (reason === null) return;
            await fetch('/api/reason', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ studentId, reason }) });
            fetchStudents();
        }

        async function givePenalty(studentId) {
            const points = prompt('부여할 벌점을 숫자로 입력하세요 (예: 1):', '1');
            if (!points || isNaN(points)) return;
            await fetch('/api/penalty', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ studentId, points: Number(points) }) });
            fetchStudents();
        }
    </script>
</body>
</html>
